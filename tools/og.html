<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0b0908; font-family: Figtree, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .card { position: absolute; inset: 14px; border-radius: 24px; background: #1c1b1a; overflow: hidden; }
  .brand { position: absolute; left: 48px; top: 44px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 26px; letter-spacing: -0.03em; }
  .brand img { height: 36px; }
  h1 { position: absolute; left: 48px; bottom: 92px; margin: 0; width: 560px; font-weight: 400; font-size: 54px; line-height: 1.1; letter-spacing: -0.025em; }
  p { position: absolute; left: 48px; bottom: 46px; margin: 0; font-size: 21px; color: rgba(255,255,255,0.7); }
  .bag { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); height: 520px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="../web/public/art/mascot.webp" alt="" />baghedge</div>
    <h1>Protect your bags without selling a coin.</h1>
    <p>A short on Hyperliquid, only below the line you draw.</p>
    <img class="bag" src="../web/public/art/bag-hero-a.webp" alt="" />
  </div>
</body>
</html>
