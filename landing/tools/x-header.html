<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&display=block" rel="stylesheet" />
<style>
  /* the X header, 1500x500. X covers the bottom left with the profile picture, so the type sits right of centre */
  html, body { margin: 0; width: 1500px; height: 500px; font-family: Figtree, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
    background-color: #0b0908; background-image: radial-gradient(circle, rgb(255 255 255 / 0.055) 0.9px, transparent 1.25px); background-size: 7px 7px; }
  .bag { position: absolute; left: 120px; top: 50%; transform: translateY(-50%); height: 430px; }
  .copy { position: absolute; left: 700px; top: 150px; }
  h1 { margin: 0; font-weight: 400; font-size: 72px; line-height: 1.05; letter-spacing: -0.03em; }
  p { margin: 18px 0 0; font-size: 24px; color: rgba(255,255,255,0.7); }
</style>
</head>
<body>
  <img class="bag" src="../web/public/art/bag-hero-a.webp" alt="" />
  <div class="copy">
    <h1>Trade perps.<br />Hedge your bag.</h1>
    <p>A Hyperliquid terminal that can hedge the SOL in your wallet.</p>
  </div>
</body>
</html>
