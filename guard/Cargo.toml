[package]
name = "baghedge-guard-probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "baghedge-guard-probe"
path = "src/main.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
wit-bindgen = "0.36"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
